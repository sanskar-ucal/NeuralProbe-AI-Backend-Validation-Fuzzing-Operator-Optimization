# Known upstream issues found by NeuralProbe. A waived failure is still reported (with repro bundle),
# but does not fail CI. Keep waivers as narrow as possible so new bugs in the same op are not hidden.
# Fields (all optional, glob): op, backend, dtype, quant, dist, category; plus label_regex.
waivers:
  - id: NP-001
    op: matmul
    backend: ort-cpu*
    dist: special
    category: nonfinite_mismatch
    reason: >-
      ORT 1.31 arm64: MatMul with constant (prepacked) B drops NaN -- returns -FLT_MAX (fp32) / -inf (fp16).
      Auto-triage: disappears with mlas.disable_kleidiai=1 (KleidiAI micro-kernel clamp uses NaN-dropping min/max).
      Minimized repro: 1x1 @ 1x1.

  - id: NP-002
    op: matmul
    backend: ort-cpu
    quant: int8_qdq_per_channel
    category: backend_error
    label_regex: "batched B"
    reason: >-
      ORT 1.31 QDQ fusion rewrites DQ(per-channel, batched B) -> MatMul -> Q into QLinearMatMul, whose kernel
      rejects that zero-point shape at runtime ("weight zero point must be a scalar ..."). Auto-triage: passes with
      graph optimizations disabled (optimizer/kernel capability mismatch). Minimized repro: 1x1 @ 1x2 batched B.

  - id: NP-003
    op: softmax
    backend: ort-coreml
    category: numerical_mismatch
    label_regex: "^axis=-3,shape=\\[\\d+, \\d+, \\d+\\]$"
    reason: >-
      ORT 1.31 CoreML EP (MLProgram): Softmax on a rank-3 input with axis=-3 returns wrong values (equivalent
      axis=0 is correct; other ranks/negative axes are correct). Minimized repro: shape [1,1,2], axis=-3.

  - id: NP-004
    op: gelu
    backend: ort-coreml
    dtype: float16
    category: numerical_mismatch
    reason: >-
      CoreML EP executes the erf-decomposed GELU entirely in fp16; 1 + erf(x/sqrt2) cancels to 0 for x < ~-3, so
      outputs of magnitude ~1e-3 flush to 0. PyTorch computes fp16 GELU internally in fp32 and ORT-CPU fuses the
      subgraph into a Gelu kernel, so both stay accurate. Precision hazard rather than a bug.
