name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernels:
    name: kernels (${{ matrix.os }}, ${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04]
        variant: [release, asan-ubsan]
        include:
          - os: ubuntu-24.04-arm
            variant: force-scalar
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          case "${{ matrix.variant }}" in
            release)      scripts/build_native.sh build ;;
            asan-ubsan)   scripts/build_native.sh build -DNP_SANITIZE=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo ;;
            force-scalar) scripts/build_native.sh build -DNP_FORCE_SCALAR=ON ;;
          esac
      - name: GoogleTest
        run: ctest --test-dir build --output-on-failure
      - name: Micro-benchmark
        if: matrix.variant != 'asan-ubsan'
        run: ./build/bench_kernels --quick --json bench_kernels.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: matrix.variant != 'asan-ubsan'
        with:
          name: bench-kernels-${{ matrix.os }}-${{ matrix.variant }}
          path: bench_kernels.json

  validate:
    name: differential fuzzing + regression gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Build native kernels
        run: scripts/build_native.sh build -DNP_BUILD_TESTS=OFF
      - name: Framework tests (incl. mutation tests of the harness)
        run: pytest -q
      - name: Regression gate
        run: |
          python -m neuralprobe backends
          python -m neuralprobe regress -c configs/ci.yaml -o artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neuralprobe-report-${{ matrix.os }}
          path: artifacts/

  perf-diff:
    name: perf A/B vs base (native kernels)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      - name: Benchmark base vs head on the same runner
        run: scripts/perf_ab.sh "${{ github.event.pull_request.base.sha }}" HEAD
      - name: Comment on PR
        if: always() && hashFiles('artifacts/perf_diff.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "### NeuralProbe perf A/B (base ${{ github.event.pull_request.base.sha }})"; cat artifacts/perf_diff.md; } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md --edit-last || \
            gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-ab
          path: artifacts/
